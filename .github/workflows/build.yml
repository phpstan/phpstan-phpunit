# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build"

on:
  pull_request:
  push:
    branches:
      - "2.0.x"

concurrency:
  group: build-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"

      - name: "Validate Composer"
        run: "composer validate"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Lint"
        run: "make lint"

  coding-standard:
    name: "Coding Standard"

    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Checkout build-cs"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/build-cs"
          path: "build-cs"
          ref: "2.x"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "8.2"

      - name: "Validate Composer"
        run: "composer validate"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Install build-cs dependencies"
        working-directory: "build-cs"
        run: "composer install --no-interaction --no-progress"

      - name: "Lint"
        run: "make lint"

      - name: "Coding Standard"
        run: "make cs"

  tests:
    name: "Tests"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "highest"
        phpunit-version:
          - "^9.5"
          - "^10.5"
          - "^11.5"
          - "^12.0.9"
        exclude:
          - php-version: "7.4"
            phpunit-version: "^10.5"
          - php-version: "8.0"
            phpunit-version: "^10.5"
          - php-version: "7.4"
            phpunit-version: "^11.5"
          - php-version: "8.0"
            phpunit-version: "^11.5"
          - php-version: "8.1"
            phpunit-version: "^11.5"
          - php-version: "7.4"
            phpunit-version: "^12.0.9"
          - php-version: "8.0"
            phpunit-version: "^12.0.9"
          - php-version: "8.1"
            phpunit-version: "^12.0.9"
          - php-version: "8.2"
            phpunit-version: "^12.0.9"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"

      - name: "Require specific PHPUnit version"
        run: "composer require --dev phpunit/phpunit:${{ matrix.phpunit-version }}"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress"

      - name: "Tests"
        run: "make tests"

  static-analysis:
    name: "PHPStan"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "highest"
        phpunit-version:
          - "^9.5"
          - "^10.5"
          - "^11.5"
          - "^12.0.9"
        exclude:
          - php-version: "7.4"
            phpunit-version: "^10.5"
          - php-version: "8.0"
            phpunit-version: "^10.5"
          - php-version: "7.4"
            phpunit-version: "^11.5"
          - php-version: "8.0"
            phpunit-version: "^11.5"
          - php-version: "8.1"
            phpunit-version: "^11.5"
          - php-version: "7.4"
            phpunit-version: "^12.0.9"
          - php-version: "8.0"
            phpunit-version: "^12.0.9"
          - php-version: "8.1"
            phpunit-version: "^12.0.9"
          - php-version: "8.2"
            phpunit-version: "^12.0.9"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring
          tools: composer:v2

      - name: "Require specific PHPUnit version"
        run: "composer require --dev phpunit/phpunit:${{ matrix.phpunit-version }}"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress"

      - name: "PHPStan"
        run: "make phpstan"

  mutation-testing:
    name: "Mutation Testing"
    runs-on: "ubuntu-latest"
    needs: ["tests", "static-analysis"]

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"
        operating-system: [ubuntu-latest]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Checkout build-infection"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/build-infection"
          path: "build-infection"
          ref: "1.x"

      - uses: ./build-infection/.github/actions/setup-php
        with:
          php-version: "${{ matrix.php-version }}"
          php-extensions: mbstring

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Install build-infection dependencies"
        working-directory: "build-infection"
        run: "composer install --no-interaction --no-progress"

      - name: "Configure infection"
        run: |
          php build-infection/bin/infection-config.php \
          > infection.json5
          jq . infection.json5

      - name: "Restore result cache"
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./tmp
          key: "result-cache-v1-${{ matrix.php-version }}-${{ github.run_id }}"
          restore-keys: |
            result-cache-v1-${{ matrix.php-version }}-

      - name: "Run infection"
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          infection \
            --git-diff-base=origin/"$GITHUB_BASE_REF" \
            --git-diff-lines \
            --ignore-msi-with-no-mutations \
            --min-msi=100 \
            --min-covered-msi=100 \
            --log-verbosity=all \
            --debug \
            --logger-text=php://stdout

      - name: "Save result cache"
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: ${{ !cancelled() }}
        with:
          path: ./tmp
          key: "result-cache-v1-${{ matrix.php-version }}-${{ github.run_id }}"

  name-collision:
    name: "Name Collision Detector"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3

      - name: "Name Collision Detector"
        run: "make name-collision"
